# Plataforma de Gestión integrada con SAP Business One · entorno en contenedores
#
#   cp .env.docker.example .env.docker      (Windows: copy)
#   docker compose up -d --build
#   abrir http://localhost:8080
#   correos de la demo (Mailpit): http://localhost:8025
#
# Por defecto SAP funciona en modo SIMULADO: no se conecta a ningún servidor real.
# El perfil "sap-real" agrega la API de consultas (api2) para el modo real.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    image: plataforma-ggh:latest
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
      # Correo de la demo: Mailpit (SMTP interno, sin TLS ni usuario).
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
    volumes:
      - media:/app/media
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
      - "8000"

  # Buzón de prueba para la demo: recibe todo lo que envía la plataforma
  # («Enviar por correo», recuperación de contraseña) y lo muestra en
  # http://localhost:8025. No entrega nada a direcciones reales.
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      - "8025:8025"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web

  # Solo para SAP_MODO=real: API de consultas de solo lectura sobre SAP HANA.
  api2:
    profiles: ["sap-real"]
    build: ./api2
    restart: unless-stopped
    env_file: ./api2/.env
    expose:
      - "8001"

volumes:
  pgdata:
  media:
  logs:
