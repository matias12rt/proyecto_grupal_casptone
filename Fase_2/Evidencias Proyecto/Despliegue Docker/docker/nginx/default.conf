# Proxy inverso delante de gunicorn.
# - Los estáticos los sirve WhiteNoise desde la aplicación (comprimidos y con huella).
# - /media/ NO se publica: adjuntos y evidencias se entregan solo por vistas que
#   validan el permiso de quien los pide (ver Informe de seguridad, ADR-15).
# - Para HTTPS, agregar aquí el certificado (listen 443 ssl) y activar
#   SECURE_SSL_REDIRECT=True en .env.docker.

upstream plataforma {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;   # evidencias de posventa de hasta 25 MB

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://plataforma;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
